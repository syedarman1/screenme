<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      background: #f5f5f3;
      font-family: Arial, sans-serif;
      color: #171717;
    "
  >
    <main
      style="
        max-width: 520px;
        margin: 40px auto;
        padding: 36px;
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
      "
    >
      <p style="font-weight: bold; font-size: 20px">ScreenMe</p>
      <h1 style="font-size: 28px">Confirm your email</h1>
      <p style="line-height: 1.7">
        Finish setting up your account to save your work and prepare your next
        application.
      </p>
      <p style="margin: 28px 0">
        <a
          href="{{ .ConfirmationURL }}"
          style="
            background: #171717;
            color: white;
            padding: 14px 22px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
          "
          >Confirm email</a
        >
      </p>
      <p style="font-size: 13px; color: #666; line-height: 1.6">
        If you did not create a ScreenMe account, you can ignore this email.
      </p>
    </main>
  </body>
</html>
